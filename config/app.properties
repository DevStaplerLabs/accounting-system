# ---------------------------------------------------------------
# StaplerLabs Accounting System: configuration
# ---------------------------------------------------------------

server.port=8080

# Database to use: mysql  or  h2
#   mysql : your local MySQL 8 server (fill in user and password below).
#           The database "staplerlabs_accounts" is created automatically.
#   h2    : built-in SQL database stored in the data folder. No setup needed.
db.type=h2

mysql.url=jdbc:mysql://localhost:3306/staplerlabs_accounts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
mysql.user=root
mysql.password=

h2.url=jdbc:h2:./data/accounting;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE

# First login. This user is created only when the users table is empty.
# Sign in with these, then change the password from the user menu.
admin.username=admin
admin.default.password=admin123
